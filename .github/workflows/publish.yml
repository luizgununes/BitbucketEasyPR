name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to
        required: true
        default: both
        type: choice
        options:
          - both
          - marketplace
          - openvsx

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  marketplace:
    if: github.event_name == 'release' || inputs.registry == 'both' || inputs.registry == 'marketplace'
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @vscode/vsce publish --oidc

  openvsx:
    if: github.event_name == 'release' || inputs.registry == 'both' || inputs.registry == 'openvsx'
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ovsx publish --trusted-publishing
